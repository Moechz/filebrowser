# ===========================================================================
# File Browser for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : filebrowser/filebrowser:v2.32.0 (Docker Hub, used unmodified)
#                  -> https://github.com/filebrowser/filebrowser
#
# Ports   : host 8128 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/filebrowserdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  filebrowserdocker:
    image: filebrowser/filebrowser:v2.32.0
    # The start command must not rely on the image's own ENTRYPOINT metadata:
    # the App Center review of 2.32.0-1 saw a container whose runtime argv[0]
    # was the first *argument* ("-p") - the image entrypoint was missing on
    # that architecture, so docker exec'd "-p" directly:
    #   exec: "-p": executable file not found in $PATH  (F2).
    # Pin the entrypoint to the binary the image ships (/filebrowser) and pass
    # the flags as its arguments. Do not repeat "/filebrowser" in the command
    # list: with the entrypoint pinned that would exec the binary twice.
    entrypoint: ["/filebrowser"]
    command: ["-p", "8080", "-r", "/data", "-d", "/data/filebrowser.db"]
    container_name: filebrowserdocker
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8128:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/filebrowserdocker/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8128
    protocol: http
